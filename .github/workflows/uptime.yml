name: Uptime Vantelia

# Vigila produccion cada ~15 min. Si la API o la web caen, el workflow falla
# y GitHub envia email al dueño del repo (ajustes por defecto de notificaciones).
# No sustituye a un monitor comercial, pero avisa sin depender de mas cuentas.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API /health (app.vantelia.es)
        run: |
          for i in 1 2 3; do
            body=$(curl -sS --max-time 15 https://app.vantelia.es/health || true)
            status=$(echo "$body" | jq -r '.status' 2>/dev/null || echo "")
            if [ "$status" = "ok" ]; then
              echo "API OK"; exit 0
            fi
            echo "intento $i fallido: $body"; sleep 20
          done
          echo "::error::API /health no responde ok tras 3 intentos"
          exit 1

      - name: Web publica (www.vantelia.es)
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 https://www.vantelia.es/ || echo 000)
            if [ "$code" = "200" ]; then
              echo "Web OK"; exit 0
            fi
            echo "intento $i: HTTP $code"; sleep 20
          done
          echo "::error::Web publica no devuelve 200 tras 3 intentos"
          exit 1

      - name: Central embebida (iframe de la home)
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "https://app.vantelia.es/central/van?embed=1" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::La central de demo devuelve HTTP $code"
            exit 1
          fi
          echo "Central OK"

      # Salud REAL del email (login SMTP sin enviar). Detecta el caso "Disabled
      # by user from hPanel" que dejo el SaaS semanas sin emails sin que nadie
      # lo supiera. Requiere el secret ADMIN_API_TOKEN; si no existe, se omite.
      - name: Email SMTP (login real, sin enviar)
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Secret ADMIN_API_TOKEN no configurado; check de email omitido."
            exit 0
          fi
          for i in 1 2 3; do
            body=$(curl -sS --max-time 25 -H "Authorization: Bearer $ADMIN_API_TOKEN" "https://app.vantelia.es/admin/email-health?fresh=1" || true)
            ok=$(echo "$body" | jq -r '.ok' 2>/dev/null || echo "")
            if [ "$ok" = "true" ]; then
              echo "SMTP OK"; exit 0
            fi
            err=$(echo "$body" | jq -r '.smtp.error // empty' 2>/dev/null || echo "")
            echo "intento $i: smtp ok=$ok error=$err"; sleep 20
          done
          echo "::error::El SMTP de produccion no acepta login (los emails del SaaS no salen): $err"
          exit 1

      # Salud REAL del modelo. Se agotaron los creditos de OpenAI y el asistente
      # dejo de contestar a TODOS los clientes; /health seguia en verde porque
      # solo miraba que la clave estuviera puesta, y se descubrio probando el
      # chat a mano. Requiere el secret ADMIN_API_TOKEN; si no existe, se omite.
      - name: IA (pregunta real al modelo)
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Secret ADMIN_API_TOKEN no configurado; check de IA omitido."
            exit 0
          fi
          for i in 1 2 3; do
            body=$(curl -sS --max-time 25 -H "Authorization: Bearer $ADMIN_API_TOKEN" "https://app.vantelia.es/admin/ia-health?fresh=1" || true)
            ok=$(echo "$body" | jq -r '.ok' 2>/dev/null || echo "")
            if [ "$ok" = "true" ]; then
              echo "IA OK"; exit 0
            fi
            err=$(echo "$body" | jq -r '.ia.error // empty' 2>/dev/null || echo "")
            echo "intento $i: ia ok=$ok error=$err"; sleep 20
          done
          echo "::error::El modelo no responde: el asistente no contesta a NADIE (¿saldo de OpenAI?): $err"
          exit 1
