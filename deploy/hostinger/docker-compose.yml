services:
  vantelia:
    build:
      context: ../..
      dockerfile: Dockerfile
    # Nombre FIJO de la imagen: sin el, cada reconstruccion deja una imagen con
    # nombre generado por compose y no hay forma de decir "vuelve a la anterior".
    # Con el, el deploy etiqueta la viva como vantelia:prev antes de reconstruir
    # y el rollback es un docker tag + up -d (segundos, sin reconstruir).
    image: vantelia:current
    container_name: vantelia-app
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    volumes:
      - ../../data:/app/data
      - ../../storage:/app/storage
      - ../../config.json:/app/config.json
      - ../../secrets:/app/secrets
      # Webs de escaparate por cliente: montadas como volumen para poder
      # retocarlas en caliente (scp) sin reconstruir la imagen. El deploy sigue
      # subiendo el contenido del repo a /srv/vantelia/client_sites.
      - ../../client_sites:/app/client_sites
