[general]
static=yes
writeprotect=yes

; Lo que marca Sara: solo moviles y fijos espanoles, para que nadie pueda usar el puente para
; llamar al extranjero a nuestra costa aunque se hiciera con la clave.
; Comunica -> 486 (ElevenLabs lo avisa como "busy") y no contesta -> 480 ("no-answer"): el
; lanzador los trata igual que con Twilio.
[desde-elevenlabs]
exten => _+34[6789]XXXXXXXX,1,NoOp(Sara llama a ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@zadarma,60)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?ocupado)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?nocoge)
 same => n,Hangup()
 same => n(ocupado),Busy(2)
 same => n(nocoge),Hangup(19)

; Lo que entra al 91 por la extension no se atiende aqui: se rechaza como ocupado, para que
; salte el desvio de la extension en Zadarma (al movil de Pablo).
[desde-zadarma]
exten => _X.,1,Hangup(17)
exten => _+X.,1,Hangup(17)

; Diagnostico sin ElevenLabs (solo se usa a mano, con "channel originate" desde la consola):
; al descolgar pita cada segundo, para que salga audio desde el principio, y graba 15 s de
; lo que dice la otra persona en /tmp del contenedor.
[prueba-audio]
exten => s,1,Set(ARCHIVO=/tmp/prueba-${STRFTIME(${EPOCH},,%H%M%S)})
 same => n,Playtones(440/120,0/880)
 same => n,Record(${ARCHIVO}.wav,0,15,qk)
 same => n,StopPlaytones()
 same => n,Hangup()
