[general]
static=yes
writeprotect=yes

; Lo que marca Sara: solo numeracion ordinaria espanola, para que nadie pueda usar el puente
; para llamar a nuestra costa aunque se hiciera con la clave. Moviles 6 y 71-74; fijos
; geograficos 81-88 y 91-98. Fuera, a proposito: 80x/90x (gratuitos, coste compartido y
; tarificacion adicional: 803, 806, 807, 905...), 70x (numeracion personal) y lo
; internacional (revision de Astra, 28-sep-2026: con +34[6789] pasaban 807 y 905).
; Maximo 3 llamadas a la vez y 10 minutos cada una.
; Comunica -> 486 (ElevenLabs lo avisa como "busy") y no contesta -> 480 ("no-answer"): el
; lanzador los trata igual que con Twilio.
[desde-elevenlabs]
exten => _+346XXXXXXXX,1,Goto(marcar,${EXTEN},1)
exten => _+347[1-4]XXXXXXX,1,Goto(marcar,${EXTEN},1)
exten => _+348[1-8]XXXXXXX,1,Goto(marcar,${EXTEN},1)
exten => _+349[1-8]XXXXXXX,1,Goto(marcar,${EXTEN},1)

[marcar]
exten => _+34X.,1,NoOp(Sara llama a ${EXTEN})
 same => n,Set(GROUP()=sara)
 same => n,GotoIf($[${GROUP_COUNT(sara)} > 3]?lleno)
 same => n,Dial(PJSIP/${EXTEN}@zadarma,60,L(600000))
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?ocupado)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?nocoge)
 same => n,Hangup()
 same => n(ocupado),Busy(2)
 same => n(nocoge),Hangup(19)
 same => n(lleno),Congestion(2)

; Lo que entra al 91 (casi siempre, devolver una llamada de Sara) lo atiende Sara (Pablo,
; 30-sep-2026: "que llamen al asistente y que atienda Sara"). Se pasa a ElevenLabs con el
; numero de quien llama en X-Caller-ID (llega a Sara como system__caller_id: con el se
; encuentra su ficha). Si ElevenLabs no coge o no cabe (3 a la vez, como las salientes), se
; rechaza como ocupado: salta el desvio de la extension en Zadarma, como antes.
[desde-zadarma]
exten => _X.,1,Goto(entrante,s,1)
exten => _+X.,1,Goto(entrante,s,1)
exten => s,1,Goto(entrante,s,1)

; El numero de quien llama se guarda ANTES de marcar (QUIEN, heredable): en la subrutina de
; cabeceras se ejecuta en el canal hacia ElevenLabs, donde CALLERID(num) ya no es quien llama
; sino "s" (primera prueba, 30-sep-2026: ElevenLabs recibio X-Caller-ID: s).
[entrante]
exten => s,1,NoOp(Llaman al 91 desde ${CALLERID(num)})
 same => n,Set(__QUIEN=${CALLERID(num)})
 same => n,Set(GROUP()=sara)
 same => n,GotoIf($[${GROUP_COUNT(sara)} > 3]?ocupado)
 same => n,Dial(PJSIP/elevenlabs_entrada,30,b(cabeceras^s^1)L(600000))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?fin)
 same => n(ocupado),Hangup(17)
 same => n(fin),Hangup()

[cabeceras]
exten => s,1,ExecIf($["${QUIEN}" != ""]?Set(PJSIP_HEADER(add,X-Caller-ID)=${QUIEN}))
 same => n,Return()

; Por el endpoint de las entrantes no puede entrar nada: solo se usa para marcar a ElevenLabs.
[sin-entrada]
exten => _.,1,Hangup(21)

; Diagnostico sin ElevenLabs (solo a mano, desde la consola):
;   asterisk -rx "channel originate PJSIP/+34...@zadarma extension s@prueba-audio"
; Al descolgar suena vantelia/prueba_es si existe (/srv/sara-puente/sonidos/prueba_es.ulaw)
; y se graba aparte lo que llega de quien contesta, unos 30 s, en /tmp del contenedor.
; Quien conteste tiene que hablar desde que descuelga.
[prueba-audio]
exten => s,1,Set(ARCHIVO=/tmp/prueba-${STRFTIME(${EPOCH},,%H%M%S)})
 same => n,MixMonitor(${ARCHIVO}.wav,r(${ARCHIVO}-oye.wav))
 same => n,Playback(vantelia/prueba_es)
 same => n,Wait(26)
 same => n,Hangup()
exten => h,1,NoOp(COLGADA causa=${HANGUPCAUSE})
