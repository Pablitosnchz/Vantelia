<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso · Vantelia</title>
  <link rel="icon" type="image/png" href="/brand-assets/favicon.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      color-scheme: dark;
      --bg:          #0B132B;
      --text:        #F0F4F8;
      --soft:        #8fa3b4;
      --soft-2:      #637c8e;
      --line:        rgba(255,255,255,0.08);
      --line-glow:   rgba(0,209,255,0.22);
      --accent:      #00D1FF;
      --accent-2:    #00F5D4;
      --accent-soft: rgba(0,209,255,0.10);
      --danger:      #ff7b86;
      --danger-soft: rgba(255,123,134,0.12);
      --font:        'Inter', 'Segoe UI', sans-serif;
      --font-title:  'Space Grotesk', 'Segoe UI', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(0,209,255,0.09), transparent 35%),
        radial-gradient(ellipse at 85% 80%, rgba(0,245,212,0.06), transparent 30%),
        linear-gradient(160deg, #0e1b3e 0%, #0B132B 52%, #07101f 100%);
      overflow-x: hidden;
    }

    /* ── Fondo decorativo ── */
    .bg-grid {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,209,255,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,209,255,0.022) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 15%, transparent 100%);
      pointer-events: none; z-index: 0;
    }
    .bg-orb {
      position: fixed; border-radius: 50%;
      pointer-events: none; z-index: 0;
    }
    .orb-1 {
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(0,209,255,0.07) 0%, transparent 70%);
      top: -160px; right: -110px;
    }
    .orb-2 {
      width: 360px; height: 360px;
      background: radial-gradient(circle, rgba(0,245,212,0.05) 0%, transparent 70%);
      bottom: -90px; left: -70px;
    }

    /* ── Card ── */
    .login-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      animation: cardIn 0.48s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    .login-card {
      background: rgba(10,18,46,0.9);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 36px 32px;
      backdrop-filter: blur(18px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.42), 0 0 0 1px rgba(0,209,255,0.05);
      position: relative; overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 12%; right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,209,255,0.42), transparent);
    }

    /* ── Logo ── */
    .card-logo {
      display: flex; justify-content: center;
      margin-bottom: 22px;
    }
    .card-logo img {
      height: 42px; width: auto;
      filter: drop-shadow(0 0 18px rgba(0,209,255,0.22));
    }

    /* ── Cabecera ── */
    .card-head { text-align: center; margin-bottom: 24px; }
    .card-head h1 {
      font-family: var(--font-title);
      font-size: 1.5rem; font-weight: 700;
      letter-spacing: -0.02em; margin-bottom: 5px;
    }
    .card-subtitle {
      font-size: 0.85rem; color: var(--soft);
      line-height: 1.5;
      min-height: 20px;
      transition: opacity 0.2s;
    }

    /* ── Tabs de rol ── */
    .role-tabs {
      display: flex;
      background: rgba(255,255,255,0.035);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 3px; gap: 3px;
      margin-bottom: 22px;
      transition: opacity 0.2s;
    }
    .role-tabs.hidden { display: none; }
    .role-tab {
      flex: 1; padding: 9px 12px;
      border-radius: 7px; border: none;
      background: transparent; color: var(--soft);
      font-family: var(--font);
      font-size: 0.84rem; font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }
    .role-tab:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .role-tab.active {
      background: rgba(0,209,255,0.12);
      color: var(--accent);
    }

    /* ── Grupos de campo ── */
    .form-group { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    .f-label { font-size: 0.81rem; font-weight: 600; color: var(--text); letter-spacing: 0.01em; }
    .input-wrap { position: relative; }
    .f-input {
      width: 100%;
      background: rgba(7,18,45,0.9);
      border: 1.5px solid rgba(255,255,255,0.09);
      border-radius: 10px;
      padding: 12px 15px;
      font-family: var(--font);
      font-size: 0.92rem; color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }
    .f-input::placeholder { color: var(--soft-2); font-size: 0.87rem; }
    .f-input:hover  { border-color: rgba(0,209,255,0.26); background: rgba(7,18,45,0.96); }
    .f-input:focus  { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,209,255,0.11); }
    .f-input.has-toggle { padding-right: 44px; }
    .f-input.has-error  { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }

    /* ── Toggle contraseña ── */
    .pwd-toggle {
      position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--soft-2);
      cursor: pointer; padding: 4px; border-radius: 4px;
      display: flex; align-items: center; transition: color 0.15s;
      box-shadow: none;
    }
    .pwd-toggle:hover { color: var(--accent); transform: translateY(-50%) !important; filter: none !important; box-shadow: none !important; }

    /* ── Fila recordarme / olvidé ── */
    .form-meta {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .check-label {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; user-select: none;
      font-size: 0.83rem; color: var(--soft); font-weight: 500;
    }
    .check-label input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .check-box {
      width: 16px; height: 16px;
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 4px; background: transparent;
      transition: background 0.15s, border-color 0.15s;
      position: relative; flex-shrink: 0;
    }
    .check-label input:checked + .check-box {
      background: var(--accent); border-color: var(--accent);
    }
    .check-label input:checked + .check-box::after {
      content: '';
      position: absolute;
      left: 4px; top: 1px;
      width: 5px; height: 8px;
      border: 2px solid #04101c;
      border-left: none; border-top: none;
      transform: rotate(45deg);
    }
    .forgot-link {
      font-size: 0.83rem; color: var(--soft); font-weight: 500;
      background: none; border: none; cursor: pointer;
      font-family: var(--font); padding: 0;
      transition: color 0.15s;
      box-shadow: none; border-radius: 0;
    }
    .forgot-link:hover { color: var(--accent); transform: none !important; filter: none !important; box-shadow: none !important; }

    /* ── Botón primario ── */
    .btn-primary {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #04101c;
      font-family: var(--font-title); font-size: 0.94rem; font-weight: 700;
      letter-spacing: 0.01em; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform 0.18s, box-shadow 0.18s, filter 0.18s, opacity 0.18s;
      box-shadow: 0 6px 22px rgba(0,209,255,0.22);
    }
    .btn-primary:hover  { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,209,255,0.30); filter: brightness(1.05); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.52; cursor: not-allowed; transform: none; filter: none; box-shadow: 0 6px 22px rgba(0,209,255,0.12); }

    /* ── Botón ghost ── */
    .btn-ghost {
      width: 100%; padding: 11px; border-radius: 10px;
      background: transparent;
      border: 1px solid var(--line); color: var(--soft);
      font-family: var(--font); font-size: 0.86rem; font-weight: 600;
      cursor: pointer; box-shadow: none;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: border-color 0.18s, color 0.18s, background 0.18s;
      margin-top: 10px;
    }
    .btn-ghost:hover { border-color: rgba(0,209,255,0.3); color: var(--accent); background: rgba(0,209,255,0.06); transform: none; filter: none; box-shadow: none; }

    /* ── Spinner ── */
    .btn-spinner {
      display: none; width: 17px; height: 17px;
      border: 2px solid rgba(4,16,28,0.25);
      border-top-color: #04101c;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-primary.loading .btn-text    { display: none; }
    .btn-primary.loading .btn-spinner { display: inline-block; }
    .btn-primary.loading { pointer-events: none; }

    /* ── Mensajes de estado ── */
    .status-area { margin-top: 12px; min-height: 0; }
    .status-msg {
      display: none; font-size: 0.84rem;
      line-height: 1.5; border-radius: 8px;
      padding: 10px 13px;
    }
    .status-msg.visible { display: block; }
    .status-msg.info    { color: var(--soft); }
    .status-msg.error   { color: #ffd7db; background: var(--danger-soft); border: 1px solid rgba(255,123,134,0.2); }
    .status-msg.success { color: var(--accent-2); background: rgba(0,245,212,0.07); border: 1px solid rgba(0,245,212,0.18); }

    /* ── Feedback forgot ── */
    .feedback-box {
      display: none; padding: 11px 13px; border-radius: 8px;
      font-size: 0.84rem; line-height: 1.55; margin-top: 14px;
    }
    .feedback-box.visible { display: block; }
    .feedback-box.success { color: var(--accent-2); background: rgba(0,245,212,0.07); border: 1px solid rgba(0,245,212,0.18); }
    .feedback-box.error   { color: #ffd7db; background: var(--danger-soft); border: 1px solid rgba(255,123,134,0.2); }

    /* ── Vistas ── */
    .view { display: none; }
    .view.active {
      display: block;
      animation: viewIn 0.22s ease both;
    }
    @keyframes viewIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    /* ── Volver ── */
    .back-row { display: flex; align-items: center; margin-bottom: 18px; }
    .back-btn {
      background: none; border: none; color: var(--soft);
      cursor: pointer; font-family: var(--font);
      font-size: 0.83rem; font-weight: 500;
      display: flex; align-items: center; gap: 5px;
      padding: 0; transition: color 0.15s;
      box-shadow: none; border-radius: 0;
    }
    .back-btn:hover { color: var(--accent); transform: none; filter: none; box-shadow: none; }

    /* ── Hint contraseña ── */
    .pwd-hint { font-size: 0.75rem; color: var(--soft-2); }

    /* ── Divisor y footer ── */
    .card-divider { height: 1px; background: var(--line); margin: 22px 0 14px; }
    .card-footer  { text-align: center; font-size: 0.8rem; color: var(--soft-2); }
    .card-footer a { color: var(--soft); text-decoration: none; transition: color 0.15s; }
    .card-footer a:hover { color: var(--accent); }
    .support-note { text-align: center; font-size: 0.77rem; color: var(--soft-2); margin-top: 6px; }
    .support-note a { color: var(--soft); text-decoration: underline; text-underline-offset: 2px; }

    /* ── Google button + signup extras (Vantelia 2.0) ── */
    .btn-google {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 12px 16px;
      background: #ffffff; color: #1f1f1f;
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 12px;
      font-family: var(--font); font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .btn-google:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,209,255,0.18); }
    .btn-google:active { transform: translateY(0); }
    .btn-google:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .divider-or {
      display: flex; align-items: center; gap: 10px;
      color: var(--soft-2); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
      margin: 18px 0 14px;
    }
    .divider-or::before, .divider-or::after { content: ''; flex: 1; height: 1px; background: var(--line); }

    .switch-mode {
      margin-top: 18px; text-align: center;
      color: var(--soft); font-size: 0.9rem;
    }
    .link-btn {
      background: none; border: 0; padding: 0;
      color: var(--accent); font-weight: 600; cursor: pointer; font-size: inherit;
      margin-left: 4px;
    }
    .link-btn:hover { text-decoration: underline; }

    .check-optin { margin: 6px 0 14px; }

    .legal-note {
      margin-top: 12px; font-size: 0.78rem; color: var(--soft-2); text-align: center; line-height: 1.5;
    }
    .legal-note a { color: var(--accent); text-decoration: none; }
    .legal-note a:hover { text-decoration: underline; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .login-card { padding: 32px 22px 26px; }
      .card-head h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-orb orb-1" aria-hidden="true"></div>
<div class="bg-orb orb-2" aria-hidden="true"></div>

<div class="login-wrap">
  <div class="login-card">

    <!-- Logo -->
    <div class="card-logo">
      <img src="/brand-assets/Logo_1_sin_resplandor.png" alt="Vantelia" />
    </div>

    <!-- Cabecera -->
    <div class="card-head">
      <h1 id="cardTitle">Acceso al portal</h1>
      <p class="card-subtitle" id="cardSubtitle">Clientes y administradores</p>
    </div>

    <!-- Tabs de rol (solo en login) -->
    <div class="role-tabs" id="roleTabs" role="tablist" aria-label="Tipo de acceso">
      <button class="role-tab active" id="tabCliente" role="tab" aria-selected="true" type="button">Cliente</button>
      <button class="role-tab"        id="tabAdmin"   role="tab" aria-selected="false" type="button">Administrador</button>
    </div>

    <!-- ─── VISTA LOGIN ─── -->
    <div id="loginView" class="view active" role="tabpanel">

      <button class="btn-google" id="googleLoginBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.5-5.2l-6.2-5.2c-2 1.4-4.5 2.4-7.3 2.4-5.2 0-9.6-3.3-11.2-8l-6.5 5C9.5 39.5 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4 5.6l6.2 5.2C40 35.3 44 30.1 44 24c0-1.2-.1-2.3-.4-3.5z"/>
        </svg>
        Continuar con Google
      </button>

      <div class="divider-or"><span>o con tu email</span></div>

      <div class="form-group">
        <label class="f-label" for="email">Email</label>
        <input class="f-input" type="email" id="email"
          placeholder="tu@empresa.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label class="f-label" for="password">Contraseña</label>
        <div class="input-wrap">
          <input class="f-input has-toggle" type="password" id="password"
            placeholder="Tu contraseña" autocomplete="current-password" />
          <button class="pwd-toggle" id="togglePwd" type="button" aria-label="Mostrar contraseña" tabindex="-1">
            <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-meta">
        <label class="check-label">
          <input type="checkbox" id="rememberMe" />
          <span class="check-box"></span>
          Recordarme
        </label>
        <button class="forgot-link" id="showForgotBtn" type="button">
          ¿Olvidaste tu contraseña?
        </button>
      </div>

      <button class="btn-primary" id="loginBtn" type="button">
        <span class="btn-text">Iniciar sesión</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>

      <div class="status-area">
        <div class="status-msg" id="loginStatus" aria-live="polite"></div>
      </div>

      <div class="switch-mode">
        ¿No tienes cuenta?
        <button class="link-btn" id="showSignupBtn" type="button">Crear cuenta gratis</button>
      </div>
    </div>

    <!-- ─── VISTA SIGNUP ─── -->
    <div id="signupView" class="view" role="tabpanel">

      <button class="btn-google" id="googleSignupBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.5-5.2l-6.2-5.2c-2 1.4-4.5 2.4-7.3 2.4-5.2 0-9.6-3.3-11.2-8l-6.5 5C9.5 39.5 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4 5.6l6.2 5.2C40 35.3 44 30.1 44 24c0-1.2-.1-2.3-.4-3.5z"/>
        </svg>
        Crear cuenta con Google
      </button>

      <div class="divider-or"><span>o con tu email</span></div>

      <div class="form-group">
        <label class="f-label" for="signupName">Tu nombre</label>
        <input class="f-input" type="text" id="signupName"
          placeholder="Como te llamamos" autocomplete="name" maxlength="120" />
      </div>

      <div class="form-group">
        <label class="f-label" for="signupEmail">Email</label>
        <input class="f-input" type="email" id="signupEmail"
          placeholder="tu@empresa.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label class="f-label" for="signupPassword">Contraseña</label>
        <input class="f-input" type="password" id="signupPassword"
          placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" />
        <span class="pwd-hint">Mínimo 8 caracteres</span>
      </div>

      <label class="check-label check-optin">
        <input type="checkbox" id="signupOptin" />
        <span class="check-box"></span>
        Quiero recibir consejos sobre IA para mi negocio (opcional).
      </label>

      <button class="btn-primary" id="signupBtn" type="button">
        <span class="btn-text">Crear cuenta gratis</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>

      <div class="status-area">
        <div class="status-msg" id="signupStatus" aria-live="polite"></div>
      </div>

      <p class="legal-note">
        Al crear una cuenta aceptas los <a href="/legal/terminos" target="_blank" rel="noreferrer">Términos</a>
        y la <a href="/legal/privacidad" target="_blank" rel="noreferrer">Política de privacidad</a>.
      </p>

      <div class="switch-mode">
        ¿Ya tienes cuenta?
        <button class="link-btn" id="showLoginBtn" type="button">Iniciar sesión</button>
      </div>
    </div>

    <!-- ─── VISTA RECUPERAR ─── -->
    <div id="forgotView" class="view" role="tabpanel">

      <div class="back-row">
        <button class="back-btn" id="backToLoginBtn" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          Volver al acceso
        </button>
      </div>

      <div class="form-group">
        <label class="f-label" for="forgotEmail">Email</label>
        <input class="f-input" type="email" id="forgotEmail"
          placeholder="tu@empresa.com" autocomplete="email" />
      </div>

      <button class="btn-primary" id="forgotBtn" type="button">
        <span class="btn-text">Enviar enlace de recuperación</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>

      <div id="forgotFeedback" class="feedback-box"></div>

      <div class="status-area">
        <div class="status-msg" id="forgotStatus" aria-live="polite"></div>
      </div>
    </div>

    <!-- ─── VISTA NUEVA CONTRASEÑA ─── -->
    <div id="resetView" class="view" role="tabpanel">

      <div class="form-group">
        <label class="f-label" for="resetPassword">Nueva contraseña</label>
        <div class="input-wrap">
          <input class="f-input has-toggle" type="password" id="resetPassword"
            placeholder="Mínimo 8 caracteres" autocomplete="new-password" />
          <button class="pwd-toggle" id="toggleResetPwd" type="button" aria-label="Mostrar contraseña" tabindex="-1">
            <svg id="eyeResetOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eyeResetClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="pwd-hint">Mínimo 8 caracteres</span>
      </div>

      <div class="form-group">
        <label class="f-label" for="resetPasswordConfirm">Repite la contraseña</label>
        <input class="f-input" type="password" id="resetPasswordConfirm"
          placeholder="Repite la contraseña" autocomplete="new-password" />
      </div>

      <button class="btn-primary" id="resetBtn" type="button">
        <span class="btn-text">Guardar nueva contraseña</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>

      <div class="status-area">
        <div class="status-msg" id="resetStatus" aria-live="polite"></div>
      </div>

      <button class="btn-ghost" id="resetBackBtn" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        Volver al acceso
      </button>
    </div>

    <!-- Footer -->
    <div class="card-divider"></div>
    <div class="card-footer">
      <a href="__MARKETING_SITE_URL__" target="_blank" rel="noreferrer">Ir a vantelia.es →</a>
    </div>
    <div class="support-note">
      ¿Problemas? <a href="mailto:__SUPPORT_EMAIL__">__SUPPORT_EMAIL__</a>
    </div>

  </div>
</div>

<script>
'use strict';

const urlParams  = new URLSearchParams(window.location.search);

const state = {
  view:                   urlParams.get('reset_token')
                            ? 'reset'
                            : (urlParams.get('mode') === 'signup' || urlParams.get('claim') ? 'signup' : 'login'),
  resetToken:             (urlParams.get('reset_token') || '').trim(),
  nextUrl:                (urlParams.get('next') || '').trim(),
  claim:                  (urlParams.get('claim') || '').trim(),
  role:                   'cliente',
  forgotCooldownSeconds:  0,
  forgotCooldownTimer:    null,
};

const googleError = urlParams.get('google_error');

const el = {
  cardTitle:            document.getElementById('cardTitle'),
  cardSubtitle:         document.getElementById('cardSubtitle'),
  roleTabs:             document.getElementById('roleTabs'),
  tabCliente:           document.getElementById('tabCliente'),
  tabAdmin:             document.getElementById('tabAdmin'),
  loginView:            document.getElementById('loginView'),
  signupView:           document.getElementById('signupView'),
  signupName:           document.getElementById('signupName'),
  signupEmail:          document.getElementById('signupEmail'),
  signupPassword:       document.getElementById('signupPassword'),
  signupOptin:          document.getElementById('signupOptin'),
  signupBtn:            document.getElementById('signupBtn'),
  signupStatus:         document.getElementById('signupStatus'),
  showSignupBtn:        document.getElementById('showSignupBtn'),
  showLoginBtn:         document.getElementById('showLoginBtn'),
  googleLoginBtn:       document.getElementById('googleLoginBtn'),
  googleSignupBtn:      document.getElementById('googleSignupBtn'),
  forgotView:           document.getElementById('forgotView'),
  resetView:            document.getElementById('resetView'),
  email:                document.getElementById('email'),
  password:             document.getElementById('password'),
  togglePwd:            document.getElementById('togglePwd'),
  eyeOpen:              document.getElementById('eyeOpen'),
  eyeClosed:            document.getElementById('eyeClosed'),
  forgotEmail:          document.getElementById('forgotEmail'),
  resetPassword:        document.getElementById('resetPassword'),
  resetPasswordConfirm: document.getElementById('resetPasswordConfirm'),
  toggleResetPwd:       document.getElementById('toggleResetPwd'),
  eyeResetOpen:         document.getElementById('eyeResetOpen'),
  eyeResetClosed:       document.getElementById('eyeResetClosed'),
  loginBtn:             document.getElementById('loginBtn'),
  loginStatus:          document.getElementById('loginStatus'),
  showForgotBtn:        document.getElementById('showForgotBtn'),
  forgotBtn:            document.getElementById('forgotBtn'),
  forgotStatus:         document.getElementById('forgotStatus'),
  forgotFeedback:       document.getElementById('forgotFeedback'),
  backToLoginBtn:       document.getElementById('backToLoginBtn'),
  resetBtn:             document.getElementById('resetBtn'),
  resetStatus:          document.getElementById('resetStatus'),
  resetBackBtn:         document.getElementById('resetBackBtn'),
};

// ── Helpers de estado ───────────────────────────────────────────────
function setStatus(statusEl, message, type) {
  if (!message) { statusEl.className = 'status-msg'; statusEl.textContent = ''; return; }
  statusEl.className = `status-msg visible ${type || 'info'}`;
  statusEl.textContent = message;
}

function setForgotFeedback(message, type) {
  if (!message) { el.forgotFeedback.className = 'feedback-box'; el.forgotFeedback.textContent = ''; return; }
  el.forgotFeedback.className = `feedback-box visible ${type || 'success'}`;
  el.forgotFeedback.textContent = message;
}

function setLoading(btn, on) {
  btn.classList.toggle('loading', on);
  btn.disabled = on;
}

// ── API helper ──────────────────────────────────────────────────────
function formatDetail(d) {
  if (!d) return 'No se pudo completar la solicitud.';
  if (typeof d === 'string') return d;
  if (Array.isArray(d)) return d.map(i => i?.msg || i).join(' | ');
  if (typeof d === 'object' && d.message) return d.message;
  try { return JSON.stringify(d); } catch { return String(d); }
}

async function api(path, opts) {
  const resp = await fetch(path, { ...opts, headers: { Accept: 'application/json', ...(opts?.headers || {}) } });
  let data = null;
  try { data = await resp.json(); } catch {}
  if (!resp.ok) throw new Error(formatDetail(data?.detail));
  return data;
}

// ── Tabs de rol ─────────────────────────────────────────────────────
const roleSubtitles = {
  cliente: 'Portal de cliente · Reservas y consultas',
  admin:   'Panel de administración · Solo equipo Vantelia',
};

function setRole(role) {
  state.role = role;
  el.tabCliente.classList.toggle('active', role === 'cliente');
  el.tabAdmin.classList.toggle('active',   role === 'admin');
  el.tabCliente.setAttribute('aria-selected', String(role === 'cliente'));
  el.tabAdmin.setAttribute('aria-selected',   String(role === 'admin'));
  if (state.view === 'login') el.cardSubtitle.textContent = roleSubtitles[role];
}

el.tabCliente.addEventListener('click', () => setRole('cliente'));
el.tabAdmin.addEventListener('click',   () => setRole('admin'));

// ── Gestión de vistas ───────────────────────────────────────────────
const viewConfig = {
  login:  { el: el.loginView,  title: 'Acceso al portal',      subtitle: null,                                                           tabs: true  },
  signup: { el: el.signupView, title: 'Crea tu cuenta',        subtitle: 'Empieza gratis. 50 mensajes/mes sin tarjeta.',                  tabs: false },
  forgot: { el: el.forgotView, title: 'Recuperar contraseña',  subtitle: 'Introduce tu correo y te enviamos un enlace seguro.',           tabs: false },
  reset:  { el: el.resetView,  title: 'Nueva contraseña',      subtitle: 'Define tu nueva contraseña para recuperar el acceso.',          tabs: false },
};

function setView(view) {
  state.view = view;
  const cfg = viewConfig[view];
  Object.values(viewConfig).forEach(v => v.el.classList.remove('active'));
  cfg.el.classList.add('active');
  el.cardTitle.textContent    = cfg.title;
  el.cardSubtitle.textContent = cfg.subtitle || roleSubtitles[state.role];
  el.roleTabs.classList.toggle('hidden', !cfg.tabs);
}

// ── Toggle contraseña ───────────────────────────────────────────────
function makePwdToggle(inputEl, toggleBtn, openIcon, closedIcon) {
  toggleBtn.addEventListener('click', () => {
    const isText = inputEl.type === 'text';
    inputEl.type            = isText ? 'password' : 'text';
    openIcon.style.display  = isText ? ''     : 'none';
    closedIcon.style.display = isText ? 'none' : '';
    toggleBtn.setAttribute('aria-label', isText ? 'Mostrar contraseña' : 'Ocultar contraseña');
  });
}

makePwdToggle(el.password,      el.togglePwd,      el.eyeOpen,      el.eyeClosed);
makePwdToggle(el.resetPassword, el.toggleResetPwd, el.eyeResetOpen, el.eyeResetClosed);

// ── Cooldown olvidé contraseña ──────────────────────────────────────
function renderForgotBtn() {
  const txt = el.forgotBtn.querySelector('.btn-text');
  if (state.forgotCooldownSeconds > 0) {
    el.forgotBtn.disabled = true;
    txt.textContent = `Reenviar en ${state.forgotCooldownSeconds}s`;
  } else {
    el.forgotBtn.disabled = false;
    txt.textContent = 'Enviar enlace de recuperación';
  }
}

function startForgotCooldown(seconds) {
  state.forgotCooldownSeconds = Math.max(0, Number(seconds || 0));
  if (state.forgotCooldownTimer) clearInterval(state.forgotCooldownTimer);
  state.forgotCooldownTimer = null;
  renderForgotBtn();
  if (!state.forgotCooldownSeconds) return;
  state.forgotCooldownTimer = setInterval(() => {
    state.forgotCooldownSeconds = Math.max(0, state.forgotCooldownSeconds - 1);
    renderForgotBtn();
    if (!state.forgotCooldownSeconds) { clearInterval(state.forgotCooldownTimer); state.forgotCooldownTimer = null; }
  }, 1000);
}

// ── Acciones ────────────────────────────────────────────────────────
async function login() {
  setStatus(el.loginStatus, 'Iniciando sesión...', 'info');
  setLoading(el.loginBtn, true);
  try {
    const data = await api('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: el.email.value.trim(), password: el.password.value }),
    });
    el.password.value = '';
    window.location.href = state.nextUrl || data.redirect_to || '/portal';
  } catch (err) {
    setStatus(el.loginStatus, err.message, 'error');
    setLoading(el.loginBtn, false);
  }
}

async function signup() {
  const name  = el.signupName.value.trim();
  const email = el.signupEmail.value.trim();
  const pw    = el.signupPassword.value;
  if (!name)        { setStatus(el.signupStatus, 'Escribe tu nombre.', 'error'); return; }
  if (!email)       { setStatus(el.signupStatus, 'Email requerido.', 'error'); return; }
  if (!pw || pw.length < 8) { setStatus(el.signupStatus, 'Contraseña mínima 8 caracteres.', 'error'); return; }
  setStatus(el.signupStatus, 'Creando cuenta...', 'info');
  setLoading(el.signupBtn, true);
  try {
    const payload = {
      email,
      password: pw,
      display_name: name,
      marketing_optin: !!el.signupOptin.checked,
    };
    if (state.claim) payload.claim = state.claim;
    const data = await api('/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    el.signupPassword.value = '';
    window.location.href = state.nextUrl || data.redirect_to || '/onboarding';
  } catch (err) {
    setStatus(el.signupStatus, err.message, 'error');
    setLoading(el.signupBtn, false);
  }
}

function startGoogle(intent) {
  const next = state.nextUrl ? `&next=${encodeURIComponent(state.nextUrl)}` : '';
  const claim = state.claim ? `&claim=${encodeURIComponent(state.claim)}` : '';
  window.location.href = `/auth/google/start?intent=${encodeURIComponent(intent || 'login')}${next}${claim}`;
}

async function sendReset() {
  if (state.forgotCooldownSeconds > 0) return;
  setForgotFeedback('Comprobando la solicitud...', 'success');
  setLoading(el.forgotBtn, true);
  try {
    const data = await api('/auth/password/forgot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: el.forgotEmail.value.trim() }),
    });
    el.forgotEmail.value = '';
    setForgotFeedback(data.message || 'Si el correo está registrado, recibirás un enlace de recuperación.', 'success');
    startForgotCooldown(data.retry_after_seconds || 0);
  } catch (err) {
    setForgotFeedback(err.message, 'error');
    setStatus(el.forgotStatus, err.message, 'error');
  } finally {
    setLoading(el.forgotBtn, false);
  }
}

async function submitNewPassword() {
  if (!state.resetToken) throw new Error('Falta el token de recuperación en la URL.');
  const a = el.resetPassword.value;
  const b = el.resetPasswordConfirm.value;
  if (!a || !b) throw new Error('Escribe y confirma la nueva contraseña.');
  if (a !== b)  throw new Error('Las contraseñas no coinciden.');
  setStatus(el.resetStatus, 'Guardando contraseña...', 'info');
  setLoading(el.resetBtn, true);
  try {
    await api('/auth/password/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: state.resetToken, new_password: a }),
    });
    el.resetPassword.value = '';
    el.resetPasswordConfirm.value = '';
    state.resetToken = '';
    window.history.replaceState({}, '', window.location.pathname);
    setView('login');
    setStatus(el.loginStatus, 'Contraseña actualizada. Ya puedes iniciar sesión.', 'success');
  } catch (err) {
    setStatus(el.resetStatus, err.message, 'error');
    setLoading(el.resetBtn, false);
  }
}

// ── Event listeners ─────────────────────────────────────────────────
el.loginBtn.addEventListener('click',      login);
el.signupBtn.addEventListener('click',     signup);
el.googleLoginBtn.addEventListener('click', () => startGoogle('login'));
el.googleSignupBtn.addEventListener('click',() => startGoogle('signup'));
el.showSignupBtn.addEventListener('click',  () => { setView('signup'); setStatus(el.signupStatus, '', null); });
el.showLoginBtn.addEventListener('click',   () => { setView('login'); setStatus(el.loginStatus, '', null); });
el.showForgotBtn.addEventListener('click', () => { setView('forgot'); setForgotFeedback(''); setStatus(el.forgotStatus, '', null); });
el.backToLoginBtn.addEventListener('click',() => setView('login'));
el.forgotBtn.addEventListener('click',     () => sendReset().catch(err => setForgotFeedback(err.message, 'error')));
el.resetBtn.addEventListener('click',      () => submitNewPassword().catch(err => { setStatus(el.resetStatus, err.message, 'error'); setLoading(el.resetBtn, false); }));
el.resetBackBtn.addEventListener('click',  () => { state.resetToken = ''; window.history.replaceState({}, '', window.location.pathname); setView('login'); });

// Atajos de teclado (Enter)
el.email.addEventListener('keydown',                e => { if (e.key === 'Enter') login(); });
el.password.addEventListener('keydown',             e => { if (e.key === 'Enter') login(); });
el.signupName.addEventListener('keydown',           e => { if (e.key === 'Enter') signup(); });
el.signupEmail.addEventListener('keydown',          e => { if (e.key === 'Enter') signup(); });
el.signupPassword.addEventListener('keydown',       e => { if (e.key === 'Enter') signup(); });
el.forgotEmail.addEventListener('keydown',          e => { if (e.key === 'Enter') sendReset(); });
el.resetPasswordConfirm.addEventListener('keydown', e => { if (e.key === 'Enter') submitNewPassword().catch(err => setStatus(el.resetStatus, err.message, 'error')); });

// ── Init ─────────────────────────────────────────────────────────────
setView(state.view);
setRole('cliente');
renderForgotBtn();
if (state.view === 'reset') setStatus(el.resetStatus, 'Define tu nueva contraseña para recuperar el acceso.', 'info');
if (googleError) {
  const target = state.view === 'signup' ? el.signupStatus : el.loginStatus;
  const msg = googleError === 'signup_disabled'
    ? 'El registro de nuevas cuentas esta deshabilitado.'
    : 'No se pudo iniciar sesión con Google. Inténtalo de nuevo.';
  setStatus(target, msg, 'error');
}
</script>

</body>
</html>
